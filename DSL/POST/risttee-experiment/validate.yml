declare:
  call: declare
  version: 0.1
  description: "Risttee validation test"
  method: post
  accepts: json
  returns: json
  namespace: risttee
  allowlist:
    body:
      - field: name
        type: string
        description: "Required name field"
check_required:
  switch:
    - condition: ${incoming.body.name == null}
      next: return_missing
  next: return_ok
return_missing:
  status: 400
  return: "Missing required field: name"
return_ok:
  status: 200
  return:
    result: ${incoming.body}
    validationStatus: "ok"
